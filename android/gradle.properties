org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Wie im aktuellen Flutter-Template: Flutter wendet das Kotlin-Plugin selbst
# an, die neue AGP-9-DSL ist für Flutter-Plugins noch nicht freigegeben.
android.newDsl=false
android.builtInKotlin=false
# Kotlins inkrementelle Kompilierung scheitert unter Windows, wenn Projekt und
# Pub-Cache auf verschiedenen Laufwerken liegen ("different roots" bzw.
# "Storage ... is already registered"). Kotlin wird hier nur für drei kleine
# Plugins übersetzt, der Verzicht kostet kaum Zeit.
kotlin.incremental=false
